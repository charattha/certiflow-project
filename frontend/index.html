<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hireflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertiFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Cinzel:wght@600&family=Spectral:wght@500;600&family=Inter:wght@400;600&family=Noto+Serif+Thai:wght@500;600&family=Noto+Sans+Thai:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "brand-red": "#A0072B",
              "brand-dark": "#262324",
              "brand-surface": "#312D2E",
              // Concierge Ledger (DESIGN.md)
              ink: "#211C14",
              "ink-soft": "#5C5342",
              paper: "#F1EADB",
              sheet: "#FBF8F0",
              "sheet-alt": "#F5EFE1",
              rule: "#DED3BC",
              "rule-strong": "#C7B996",
              brass: "#8A6D1F",
              "brass-bright": "#C9A84C",
              binding: "#241D16",
              "binding-soft": "#3A2F24",
              "status-pending": "#8A6410",
              "status-interview": "#2C5578",
              "status-approved": "#3E6B4A",
              "status-completed": "#6A4B86",
              "status-rejected": "#9B3B36",
            },
            fontFamily: {
              sans: ["Prompt", "sans-serif"],
              // Concierge Ledger (DESIGN.md)
              crest: ["Cinzel", "Noto Serif Thai", "Georgia", "serif"],
              ledger: ["Spectral", "Noto Serif Thai", "Georgia", "serif"],
              data: ["Inter", "Noto Sans Thai", "system-ui", "sans-serif"],
            },
            boxShadow: {
              sheet: "0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 28px -18px rgba(36,29,22,0.30)",
              overlay: "0 24px 60px -20px rgba(36,29,22,0.45)",
            },
          },
        },
      };
    </script>
  </body>
</html>
