<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/marriott-m.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertiFlow — Marriott Marquis Bangkok Queen's Park</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Modern Marriott Marquis identity (DESIGN.md) — red, ink, grey
              ink: "#1B1B1D",
              "ink-soft": "#6B6B70",
              paper: "#F5F5F6",
              sheet: "#FFFFFF",
              "sheet-alt": "#F8F8F9",
              rule: "#E4E4E7",
              "rule-strong": "#D0D0D5",
              red: "#9A1B32",
              "red-dark": "#6E1224",
              "red-bright": "#C41230",
              binding: "#141416",
              "binding-soft": "#26262A",
              "status-pending": "#B45309",
              "status-interview": "#2563EB",
              "status-approved": "#15803D",
              "status-completed": "#7C3AED",
              "status-rejected": "#52525B",
            },
            fontFamily: {
              sans: ["Inter", "Noto Sans Thai", "system-ui", "sans-serif"],
              // Legacy token names kept so existing component classes stay valid;
              // all now resolve to the same modern sans (no serif in this world).
              crest: ["Inter", "Noto Sans Thai", "system-ui", "sans-serif"],
              ledger: ["Inter", "Noto Sans Thai", "system-ui", "sans-serif"],
              data: ["Inter", "Noto Sans Thai", "system-ui", "sans-serif"],
            },
            boxShadow: {
              sheet: "0 1px 2px 0 rgba(20,20,22,0.04), 0 6px 20px -8px rgba(20,20,22,0.10)",
              overlay: "0 24px 60px -20px rgba(20,20,22,0.35)",
            },
          },
        },
      };
    </script>
  </body>
</html>
