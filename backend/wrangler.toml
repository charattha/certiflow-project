name = "certiflow-backend"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = [ "nodejs_compat" ]

[vars]
NODE_ENV = "production"
# Set to your Cloudflare Pages URL once frontend is deployed (comma-separated if multiple).
FRONTEND_URL = "https://certiflow.pages.dev"

# Secrets (never put these in [vars] / commit them) — set via:
#   wrangler secret put DATABASE_URL
#   wrangler secret put DIRECT_URL
#   wrangler secret put JWT_SECRET

[[rules]]
type = "Data"
globs = ["**/*.docx", "**/*.ttf"]
fallthrough = true
